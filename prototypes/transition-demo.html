<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Title-flight transition demo</title>
<style>
  :root { --bg:#fff; --text:#111; --muted:#666; --line:#111; --hair:#d9d9d9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  header.top { padding:1.5rem 2rem; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; }
  header.top small { color:var(--muted); }
  .list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:2.5rem 2rem; padding:2.5rem 2rem; }
  .card { cursor:pointer; padding-top:1rem; position:relative; }
  .card .rule { position:absolute; left:0; right:0; top:0; height:1px; background:var(--line); }
  .card .num { display:block; font-size:.875rem; color:var(--muted); }
  .card .title { margin:.25rem 0; font-size:1.5rem; font-weight:500; line-height:1.2; }
  .card .tag { color:var(--muted); font-size:.875rem; margin:0; }
  .card:hover .title { text-decoration:underline; }
  .detail { display:none; padding:2.5rem 2rem; max-width:64rem; }
  .detail.on { display:block; }
  .detail .head { border-top:1px solid var(--line); padding-top:1rem; position:relative; }
  .detail .title { margin:.25rem 0 1.5rem; font-size:3.25rem; font-weight:500; line-height:1.1; }
  .detail .num { display:block; font-size:.875rem; color:var(--muted); }
  dl.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem 2rem; margin:0 0 2rem; }
  dl.facts dt { font-size:.75rem; color:var(--muted); text-transform:none; }
  dl.facts dd { margin:0; }
  .detail p.lead { max-width:40rem; }
  button.back { margin-bottom:1.5rem; border:1px solid var(--text); background:none; padding:.4rem .9rem; cursor:pointer; font:inherit; }
  /* Line layer: one hairline sweeps the viewport on every page change. */
  #sweep { position:fixed; left:0; right:0; height:1px; background:var(--line); transform:scaleX(0); transform-origin:left; opacity:0; pointer-events:none; z-index:10; }
</style>
</head>
<body>
<header class="top"><strong>Transition demo · A + C</strong><small>click a card · Esc or Back to return</small></header>
<main>
  <section class="list" id="list"></section>
  <section class="detail" id="detail">
    <button class="back" id="back">← Back</button>
    <div class="head" id="head">
      <span class="num" id="numSlot"></span>
      <div id="titleSlot"></div>
    </div>
    <dl class="facts" id="facts"></dl>
    <p class="lead">The number and title are the same elements that sat on the card; they move and grow into the header. No images are shared between the pages.</p>
  </section>
</main>
<div id="sweep"></div>
<script src="../utility/gsap.min.js"></script>
<script src="../utility/Flip.min.js"></script>
<script>
  gsap.registerPlugin(Flip);
  const projects = [
    ['01', 'Design System', 'Design · Systems', '2024', 'Lead designer'],
    ['02', 'Business Analysis', 'Design · Research', '2023', 'Product designer'],
    ['03', 'Childcare', 'Design · Product', '2023', 'Product designer'],
    ['04', 'Business Pro', 'Design · Product', '2022', 'Product designer'],
  ];
  const $ = (id) => document.getElementById(id);
  const list = $('list'), detail = $('detail'), sweep = $('sweep');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let open = null;

  projects.forEach((p) => {
    const [num, name, tag] = p;
    const card = document.createElement('article');
    card.className = 'card'; card.tabIndex = 0;
    card.innerHTML = `<span class="rule"></span><span class="num">${num}</span><h3 class="title">${name}</h3><p class="tag">${tag}</p>`;
    card.addEventListener('click', () => show(card, p));
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter') show(card, p); });
    list.append(card);
  });

  // Draw one line across the viewport, then let it fade.
  function drawLine(y, time = 0.7) {
    if (reduce) return;
    gsap.fromTo(sweep, { top: y, scaleX: 0, opacity: 1 }, { scaleX: 1, duration: time, ease: 'power2.inOut' });
    gsap.to(sweep, { opacity: 0, duration: 0.25, delay: time });
  }

  function show(card, [, name, , year, role]) {
    if (open) return;
    const num = card.querySelector('.num'), title = card.querySelector('.title');
    const state = Flip.getState([num, title], { props: 'fontSize' });
    open = { card, num, title };
    $('facts').innerHTML = [['Duration', year], ['Role', role], ['Company', '—']]
      .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
    const y = card.getBoundingClientRect().top;
    list.style.display = 'none'; detail.classList.add('on');
    $('numSlot').replaceWith(num); num.id = 'numSlot';
    $('titleSlot').replaceWith(title); title.id = 'titleSlot';
    window.scrollTo(0, 0);
    if (reduce) return;
    drawLine(y);
    Flip.from(state, { duration: 0.75, ease: 'power3.inOut', absolute: true, props: 'fontSize' });
    gsap.from('#back, #facts > div, .lead', { autoAlpha: 0, y: 12, duration: 0.5, delay: 0.5, stagger: 0.07, ease: 'power2.out' });
  }

  function hide() {
    if (!open) return;
    const { card, num, title } = open; open = null;
    const state = Flip.getState([num, title], { props: 'fontSize' });
    const slotN = document.createElement('span'), slotT = document.createElement('div');
    slotN.id = 'numSlot'; slotT.id = 'titleSlot';
    num.replaceWith(slotN); title.replaceWith(slotT);
    num.removeAttribute('id'); title.removeAttribute('id');
    list.style.display = ''; detail.classList.remove('on');
    card.querySelector('.rule').after(num); num.after(title);
    drawLine(card.getBoundingClientRect().top, 0.6);
    if (!reduce) Flip.from(state, { duration: 0.65, ease: 'power3.inOut', absolute: true, props: 'fontSize' });
  }
  $('back').addEventListener('click', hide);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
</script>
</body>
</html>
